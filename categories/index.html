---
layout: default
title: Categories
---

<section class="section page-intro blog-intro">
  <div class="container">
    <div class="section-header centered">
      <div class="section-label">Browse</div>
      <h1 class="section-title">Categories</h1>
      <p class="section-desc">Explore posts by topic.</p>
    </div>

    <div class="category-grid">
      {% for cat in site.data.categories %}
        {% assign matching_posts = site.categories[cat.name] %}

        {% if matching_posts and matching_posts.size > 0 %}
          <a
            class="category-card"
            href="{{ '/categories/' | append: cat.slug | append: '.html' | relative_url }}"
          >
            <h3>{{ cat.name }}</h3>
            <p>{{ cat.description }}</p>
          </a>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</section>
